name: "Copilot Setup Steps - Playwright"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    name: Copilot setup steps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20 and cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies (frontend/)
        working-directory: frontend
        run: |
          npm ci

      - name: Install backend dependencies (backend/)
        working-directory: backend
        run: |
          npm ci || echo "no package-lock or install failed"

      - name: Install Playwright and browsers (frontend)
        working-directory: frontend
        run: |
          # Install Playwright test runner locally (not committed)
          npm install --no-audit --no-fund --save-dev @playwright/test@1.40.0 || true
          # Install browser binaries required for Playwright
          npx playwright install --with-deps || true

      - name: Verify frontend build (fast check)
        working-directory: frontend
        run: |
          # Build to verify dependencies are functional (may be heavy)
          npm run build --if-present || echo "build skipped or failed"

      - name: Snapshot
        run: echo "copilot setup steps completed"
